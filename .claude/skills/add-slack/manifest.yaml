display_information:
  name: NanoClaw
  description: Personal Claude assistant
  background_color: "#1f2937"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: NanoClaw
    always_online: true

oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - channels:history
      - groups:history
      - im:history
      - channels:read
      - groups:read
      - users:read
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
